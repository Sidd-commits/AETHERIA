services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aetheria-frontend
    ports:
      - '8080:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aetheria-backend
    ports:
      - '5000:5000'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_ORIGIN=http://localhost:8080,http://localhost:3000
