name: AETHERIA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Lint, Test & Build (Full-Stack Monorepo)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Monorepo Dependencies
        run: npm install

      - name: 🔍 TypeScript Strict Typecheck (Frontend & Backend)
        run: npm run typecheck

      - name: 🧹 ESLint Code Quality
        run: npm run lint

      - name: ⚡ Run Vitest Suites (Frontend & Backend)
        run: npm run test

      - name: 🏗️ Production Build (Frontend & Backend)
        run: npm run build

      - name: 📊 Upload Frontend Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-frontend-dist
          path: frontend/dist/
          retention-days: 7
